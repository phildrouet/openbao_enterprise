<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Before you renew Vault</title>
<desc id="d">An abstract unseal motif: five key shards arranged around a seal ring, three of them lit, the threshold met, the ring beginning to open.</desc>
<defs>
  <radialGradient id="field" cx="72%" cy="42%" r="80%">
    <stop offset="0%" stop-color="#1a1d24"/>
    <stop offset="55%" stop-color="#121317"/>
    <stop offset="100%" stop-color="#0F0F0F"/>
  </radialGradient>
  <linearGradient id="litshard" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#5FB7FF" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#326CE5" stop-opacity="0.55"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1600" height="900" fill="url(#field)"/>

<!-- faint grid of dots, thinning toward the left where the copy sits -->
<g fill="#ffffff" opacity="0.05">
  <g id="dots">
    <circle cx="1000" cy="80" r="1.4"/><circle cx="1100" cy="80" r="1.4"/><circle cx="1200" cy="80" r="1.4"/><circle cx="1300" cy="80" r="1.4"/><circle cx="1400" cy="80" r="1.4"/><circle cx="1500" cy="80" r="1.4"/>
    <circle cx="950" cy="180" r="1.4"/><circle cx="1050" cy="180" r="1.4"/><circle cx="1150" cy="180" r="1.4"/><circle cx="1250" cy="180" r="1.4"/><circle cx="1350" cy="180" r="1.4"/><circle cx="1450" cy="180" r="1.4"/><circle cx="1550" cy="180" r="1.4"/>
    <circle cx="1000" cy="280" r="1.4"/><circle cx="1100" cy="280" r="1.4"/><circle cx="1200" cy="280" r="1.4"/><circle cx="1300" cy="280" r="1.4"/><circle cx="1400" cy="280" r="1.4"/><circle cx="1500" cy="280" r="1.4"/>
    <circle cx="950" cy="380" r="1.4"/><circle cx="1050" cy="380" r="1.4"/><circle cx="1150" cy="380" r="1.4"/><circle cx="1250" cy="380" r="1.4"/><circle cx="1350" cy="380" r="1.4"/><circle cx="1450" cy="380" r="1.4"/><circle cx="1550" cy="380" r="1.4"/>
    <circle cx="1000" cy="480" r="1.4"/><circle cx="1100" cy="480" r="1.4"/><circle cx="1200" cy="480" r="1.4"/><circle cx="1300" cy="480" r="1.4"/><circle cx="1400" cy="480" r="1.4"/><circle cx="1500" cy="480" r="1.4"/>
  </g>
</g>

<!-- the seal: concentric rings, off to the right so the scrim carries copy -->
<g transform="translate(1130 430)">
  <circle r="300" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>
  <circle r="236" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5" stroke-dasharray="4 10"/>
  <circle r="176" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- five shards on the outer ring; three lit (the unseal threshold met) -->
  <g stroke-linecap="round" fill="none">
    <!-- lit shards -->
    <g stroke="url(#litshard)" stroke-width="7" filter="url(#glow)">
      <path d="M 0 -300 A 300 300 0 0 1 176.3 -242.7" transform="rotate(-8)"/>
      <path d="M 0 -300 A 300 300 0 0 1 176.3 -242.7" transform="rotate(136)"/>
      <path d="M 0 -300 A 300 300 0 0 1 176.3 -242.7" transform="rotate(208)"/>
    </g>
    <!-- dormant shards -->
    <g stroke="#8b9199" stroke-opacity="0.35" stroke-width="5">
      <path d="M 0 -300 A 300 300 0 0 1 176.3 -242.7" transform="rotate(64)"/>
      <path d="M 0 -300 A 300 300 0 0 1 176.3 -242.7" transform="rotate(280)"/>
    </g>
  </g>

  <!-- shard tick marks feeding inward from the lit segments -->
  <g stroke="#5FB7FF" stroke-opacity="0.45" stroke-width="2">
    <line x1="0" y1="-300" x2="0" y2="-262" transform="rotate(22)"/>
    <line x1="0" y1="-300" x2="0" y2="-262" transform="rotate(166)"/>
    <line x1="0" y1="-300" x2="0" y2="-262" transform="rotate(238)"/>
  </g>

  <!-- the inner ring opening: a gap beginning to appear -->
  <g fill="none" stroke-linecap="round">
    <path d="M 0 -118 A 118 118 0 1 1 -41 110.6" stroke="#d1d5db" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M -41 110.6 A 118 118 0 0 1 -87 79.5" stroke="#5FB7FF" stroke-opacity="0.8" stroke-width="3" filter="url(#glow)"/>
  </g>

  <!-- keyway at centre -->
  <g filter="url(#glow)">
    <circle r="26" fill="none" stroke="#5FB7FF" stroke-opacity="0.85" stroke-width="3"/>
    <rect x="-4" y="10" width="8" height="40" rx="3" fill="#5FB7FF" fill-opacity="0.75"/>
  </g>
</g>

<!-- a faint horizon line grounding the composition -->
<path d="M 0 736 C 420 700 900 706 1600 668" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" fill="none"/>
</svg>
