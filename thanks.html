<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Received | ControlPlane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0F0F0F; --ring: rgba(255,255,255,0.12); --accent-bright: #5FB7FF; --ink: #d1d5db; --soft: #9ca3af; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: Montserrat, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; display: grid; min-height: 100vh; place-items: center; padding: 32px; }
  .card { max-width: 560px; border: 1px solid var(--ring); border-radius: 20px; padding: 44px 40px; background: #161616; }
  img.logo { height: 26px; }
  h1 {
    font-family: "Bebas Neue", sans-serif; font-weight: 400; text-transform: uppercase;
    font-size: 42px; letter-spacing: 0.01em; margin-top: 24px;
    background: linear-gradient(to right, #ffffff, #929292);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  p { margin-top: 14px; font-size: 15px; }
  .soft { color: var(--soft); font-size: 13.5px; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="./controlplane.svg" alt="ControlPlane">
    <h1>Received</h1>
    <p>Thanks. An engineer will come back to you about your plugin-type scope and what the subscription would cover for your estate.</p>
    <p class="soft">If your answers say the community edition is all you need, that is what we will tell you.</p>
  </div>
</body>
</html>
